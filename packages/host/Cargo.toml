[package]
name = "keetar-host"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Native messaging helper that lets the Keetar extension open and save local KeePass files"

[dependencies]
base64 = "0.22"
dirs = "6"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

# Loaded on demand and never used: dialogs here have no parent window, so builds need no Wayland libraries.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "0.3", features = ["dlopen"] }
