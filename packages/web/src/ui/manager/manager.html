<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keetar — Manager</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        margin: 0;
        height: 100vh;
        overflow: hidden;
      }
      .layout { display: flex; height: 100vh; }
      .tree-pane {
        width: 240px;
        flex-shrink: 0;
        border-right: 1px solid #ddd;
        overflow-y: auto;
        padding: 0.5rem;
      }
      .tree-pane-toolbar { display: flex; flex-wrap: wrap; gap: 0.2rem; margin-bottom: 0.5rem; }
      .tree-pane-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
      .icon-button { padding: 0.3rem 0.45rem; font-size: 15px; line-height: 1; margin-right: 0; }
      .tree-node { user-select: none; }
      .tree-node-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.25rem 0.4rem;
        border-radius: 4px;
        cursor: pointer;
        gap: 0.25rem;
      }
      .tree-node-label:hover { background: rgba(127, 127, 127, 0.12); }
      .tree-node-label.selected { background: rgba(60, 130, 246, 0.18); }
      .tree-node-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
      .tree-node-actions { display: none; gap: 0.15rem; }
      .tree-node-label:hover .tree-node-actions { display: flex; }
      .tree-children { margin-left: 1rem; }
      .tree-separator { border: none; border-top: 1px solid rgba(127, 127, 127, 0.3); margin: 0.4rem 0.4rem 0.4rem 0; }
      .middle-pane {
        width: 280px;
        flex-shrink: 0;
        border-right: 1px solid #ddd;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      .middle-pane-header { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem; border-bottom: 1px solid #eee; }
      .entry-search { display: block; width: 100%; box-sizing: border-box; margin: 0.5rem; padding: 0.4rem; font-size: 13px; }
      .entry-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem;
        border-bottom: 1px solid #f0f0f0;
        cursor: pointer;
      }
      .entry-row:hover { background: rgba(127, 127, 127, 0.08); }
      .entry-row.selected { background: rgba(60, 130, 246, 0.15); }
      .entry-row-text { min-width: 0; overflow: hidden; }
      .entry-row-title { font-weight: 600; }
      .entry-row-username { color: #666; font-size: 0.9em; }
      .entry-icon { flex-shrink: 0; border-radius: 3px; object-fit: contain; }
      .entry-icon-fallback { display: inline-block; border-radius: 50%; background: rgba(127, 127, 127, 0.3); }
      .entry-detail-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
      .entry-detail-header .entry-icon, .entry-detail-header .entry-icon-fallback { width: 28px; height: 28px; }
      .health-list { list-style: none; margin: 0; padding: 0; }
      .health-row { padding: 0.5rem 0; border-bottom: 1px solid #f0f0f0; }
      .detail-pane { flex: 1; overflow-y: auto; padding: 1rem; max-width: 480px; }
      .field { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 0.75rem; }
      .field label { font-size: 0.85em; color: #666; }
      .field input, .field textarea {
        font-size: 14px;
        padding: 0.4rem;
        width: 100%;
      }
      .url-row { display: flex; gap: 0.35rem; }
      .url-row input { min-width: 0; flex: 1; }
      .field textarea { resize: vertical; min-height: 4em; }
      .password-row { display: flex; gap: 0.25rem; }
      .password-row input { flex: 1; }
      .password-strength { color: #666; font-size: 0.85em; margin-top: 0.25rem; }
      .attachments { margin-top: 1rem; }
      .attachment-row { display: flex; justify-content: space-between; align-items: center; padding: 0.25rem 0; }
      button { font-size: 12px; padding: 0.3rem 0.6rem; cursor: pointer; }
      .icon-button { padding: 0.1rem 0.35rem; }
      .danger { color: #c00; }
      .empty-state { color: #666; padding: 1rem; }
      .save-indicator { color: #2a7a2a; font-size: 0.85em; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.js"></script>
  </body>
</html>
