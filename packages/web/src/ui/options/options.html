<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keetar — Options</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        max-width: 480px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 { font-size: 1.2rem; }
      h2 { font-size: 1rem; margin-top: 2rem; }
      section { margin-top: 0.5rem; }
      .field { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 0.75rem; max-width: 320px; }
      .field input { font-size: 14px; padding: 0.4rem; }
      button { font-size: 13px; padding: 0.4rem 0.7rem; cursor: pointer; margin-right: 0.5rem; }
      .error { color: #c00; }
      .success { color: #2a7a2a; }
      .hint { color: #666; font-size: 0.9em; }
      .choice-buttons { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
      .choice-buttons button { flex: 1; padding: 1rem; font-size: 14px; }
      .panel-box { margin-top: 1rem; }
      .vault-badge {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        margin-top: 1rem;
        padding: 0.6rem 0.8rem;
        border: 1px solid rgba(127, 127, 127, 0.3);
        border-radius: 6px;
      }
      .vault-provider-icon { width: 20px; height: 20px; flex-shrink: 0; }
      .vault-badge-text { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
      .vault-name-button { margin-right: 0; padding: 0; border: none; background: none; font: inherit; font-weight: 600; text-decoration: underline; }
      .manager-button { padding: 0.3rem 0.5rem; font-size: 15px; line-height: 1; }
      .lock-button { padding: 0.3rem 0.5rem; font-size: 15px; line-height: 1; }
      .gear-button { padding: 0.3rem 0.5rem; font-size: 15px; line-height: 1; }
      .disconnect-button { margin-right: 0; padding: 0.3rem 0.5rem; font-size: 14px; line-height: 1; color: #c00; }
      .sync-badge { font-size: 0.85em; cursor: default; }
      .sync-ok-badge { color: #2a7a2a; }
      .sync-pending-badge { color: #a06a00; }
      .sync-conflict-badge { color: #c00; }
      .sync-conflict { margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.js"></script>
  </body>
</html>
