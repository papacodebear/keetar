<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keetar</title>
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/keetar-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/keetar-32.png" />
    <style>
      :root { color-scheme: light dark; }
      html { scroll-behavior: smooth; }
      body {
        font-family: system-ui, sans-serif;
        font-size: 14px;
        max-width: 860px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 { font-size: 1.2rem; }
      h2 { font-size: 1rem; margin: 0 0 0.75rem; }
      .options-layout { display: flex; align-items: flex-start; gap: 2.5rem; margin-top: 1.5rem; }
      .options-nav { position: sticky; top: 1.5rem; flex: 0 0 170px; display: flex; flex-direction: column; gap: 0.15rem; }
      .options-nav a {
        padding: 0.4rem 0.6rem;
        border-radius: 5px;
        color: #666;
        font-size: 0.9em;
        text-decoration: none;
        border-left: 2px solid transparent;
      }
      .options-nav a:hover { background: rgba(127, 127, 127, 0.1); }
      .options-nav a.active { color: #2563eb; font-weight: 600; border-left-color: #2563eb; background: rgba(60, 130, 246, 0.1); }
      .options-content { flex: 1; min-width: 0; }
      .options-content > section { scroll-margin-top: 1.5rem; }
      .options-content > section + section {
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 1px solid rgba(127, 127, 127, 0.18);
      }
      .section-disabled { opacity: 0.5; pointer-events: none; }
      .field { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 0.75rem; max-width: 320px; }
      .field input { font-size: 14px; padding: 0.4rem; }
      .field input[type='number'] { width: 4.5rem; display: inline-block; margin: 0 0.35rem; }
      /* Sentence-style rows ("Lock the vault after ... for [5] minutes") — no 320px cap, or the label text wraps around the input. */
      .field-inline { margin-bottom: 0.6rem; }
      .field-inline input[type='number'] { width: 4.5rem; display: inline-block; margin: 0 0.35rem; font-size: 14px; padding: 0.3rem; }
      .trusted-hosts-list { list-style: none; margin: 0; padding: 0; max-width: 320px; }
      .trusted-hosts-list li { display: flex; justify-content: space-between; align-items: center; padding: 0.35rem 0; border-bottom: 1px solid rgba(127, 127, 127, 0.2); gap: 0.5rem; }
      button { font-size: 13px; padding: 0.4rem 0.7rem; cursor: pointer; margin-right: 0.5rem; }
      .error-box { display: flex; flex-direction: column; gap: 0.15rem; padding: 0.5rem 0.6rem; margin: 0.5rem 0; border: 1px dashed #c00; border-radius: 6px; max-width: 24rem; }
      .error-box-title { font-size: 0.85em; font-weight: 700; color: #c00; }
      .error-box-message { margin: 0; font-size: 0.8em; color: #c00; }
      .success { color: #2a7a2a; }
      .hint { color: #666; font-size: 0.9em; }
      .choice-buttons { display: flex; gap: 0.75rem; }
      .choice-buttons button { flex: 1; padding: 1rem; font-size: 14px; }
      .panel-box { margin-top: 1rem; }
      .vault-badge {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.6rem 0.8rem;
        border: 1px solid rgba(127, 127, 127, 0.3);
        border-radius: 6px;
      }
      .vault-provider-icon { width: 20px; height: 20px; flex-shrink: 0; }
      .vault-badge-text { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
      .vault-name-button { margin-right: 0; padding: 0; border: none; background: none; font: inherit; font-weight: 600; text-decoration: underline; }
      .manager-button { padding: 0.3rem 0.5rem; font-size: 15px; line-height: 1; }
      .lock-button { padding: 0.3rem 0.5rem; font-size: 15px; line-height: 1; }
      .gear-button { padding: 0.3rem 0.5rem; font-size: 15px; line-height: 1; }
      .disconnect-button { margin-right: 0; padding: 0.3rem 0.5rem; font-size: 14px; line-height: 1; color: #c00; }
      .sync-badge { font-size: 0.85em; cursor: default; }
      .sync-ok-badge { color: #2a7a2a; }
      .sync-pending-badge { color: #a06a00; }
      .sync-conflict-badge { color: #c00; }
      .sync-conflict { margin-top: 0.5rem; }
      .password-generator-mode { display: flex; gap: 0.25rem; margin-bottom: 0.5rem; }
      .password-generator-mode button.selected { background: rgba(60, 130, 246, 0.18); }
      .password-generator-options { display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.9em; max-width: 320px; margin-bottom: 0.75rem; }
      .password-generator-options label { display: flex; align-items: center; gap: 0.4rem; }
      .password-generator-options input[type='text'] { flex: 1; }
      .password-generator-options input[type='number'] { width: 5rem; }
      .password-generator-options input:disabled { opacity: 0.5; }
      .password-generator-symbols-row { display: flex; align-items: center; gap: 0.35rem; }
      .password-generator-symbols-row label { flex-shrink: 0; }
      .password-generator-symbols-row input[type='text'] { flex: 1; min-width: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.js"></script>
  </body>
</html>
