<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keetar passkey</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, sans-serif;
        font-size: 13px;
        margin: 0;
        padding: 0.9rem;
      }
      .panel { display: flex; flex-direction: column; gap: 0.6rem; }
      h1 { font-size: 15px; margin: 0; }
      .rp-id { color: #666; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .candidates { display: flex; flex-direction: column; gap: 0.4rem; }
      .candidates label { display: flex; align-items: center; gap: 0.4rem; }
      select, input[type='password'] {
        font-size: 13px;
        padding: 0.4rem;
        box-sizing: border-box;
        width: 100%;
      }
      .error-box { display: flex; flex-direction: column; gap: 0.15rem; padding: 0.5rem 0.6rem; border: 1px dashed #c00; border-radius: 6px; }
      .error-box-title { font-size: 0.85em; font-weight: 700; color: #c00; }
      .error-box-message { margin: 0; font-size: 0.8em; color: #c00; }
      .actions { display: flex; gap: 0.5rem; justify-content: flex-end; }
      button { font-size: 12px; padding: 0.4rem 0.7rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.js"></script>
  </body>
</html>
